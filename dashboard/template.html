<title>TurboLoRA Curves</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f4f6f4; --surface: #ffffff; --line: #d9dfdc; --grid: #e8ecea; --ink: #1a1e21; --muted: #5f6b70;
  --accent: #1f6e8c; --accent-ink: #ffffff; --warn: #a8690f; --bad: #b3423a; --good: #2f7a4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121618; --surface: #1a2023; --line: #2c3539; --grid: #222a2e; --ink: #e5e9ea; --muted: #8e9ba0;
    --accent: #5fb0cf; --accent-ink: #0d1417; --warn: #d69a3a; --bad: #e07068; --good: #5fb77f;
  }
}
:root[data-theme="dark"] {
  --ground: #121618; --surface: #1a2023; --line: #2c3539; --grid: #222a2e; --ink: #e5e9ea; --muted: #8e9ba0;
  --accent: #5fb0cf; --accent-ink: #0d1417; --warn: #d69a3a; --bad: #e07068; --good: #5fb77f;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; margin: 0; padding: 28px 40px 80px; }
h1, h2 { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; }
h2 { font-size: 20px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; margin-bottom: 20px; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }

.controls { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.toggle button { background: none; border: 0; border-right: 1px solid var(--line); color: var(--muted); padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; }
.toggle button:last-child { border-right: 0; }
.toggle button:hover { color: var(--ink); }
.toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggle button.on { background: var(--accent); color: var(--accent-ink); }
.control { display: grid; gap: 4px; }

nav { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 20px; }
nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; }
nav a:hover { color: var(--ink); }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
nav a.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
nav .group { display: flex; align-items: flex-end; gap: 4px; margin-right: 16px; }
nav .group .eyebrow { padding: 0 6px 10px 0; }
.legend .group { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; flex-basis: 100%; }
.legend .group .family { min-width: 72px; text-align: left; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.legend button { background: none; border: 0; padding: 2px 4px; color: var(--ink); cursor: pointer; font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 3px; }
.legend button:focus-visible { outline: 2px solid var(--accent); }
.legend button.off { color: var(--muted); text-decoration: line-through; }
.legend button.family { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.legend button.family:hover { color: var(--ink); }
.legend .swatch { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.legend button.off .swatch { opacity: 0.3; }
.legend .key { gap: 4px 12px; color: var(--muted); font-size: 11px; }
.legend .key button { color: var(--muted); font-size: 11px; }
.legend .key button.off svg { opacity: 0.3; }
.legend .swatch.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 3px, transparent 3px 6px); }

.chart-wrap { position: relative; }
svg { display: block; width: 100%; height: auto; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
svg .grid line { stroke: var(--grid); }
svg .axis line, svg .axis path { stroke: var(--line); fill: none; }
svg .axis text { fill: var(--muted); }
svg .axis .title { fill: var(--muted); font-family: "IBM Plex Sans", sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
svg .base { stroke-dasharray: 4 4; stroke-width: 1.2; opacity: 0.8; }
svg .base-label { font-size: 10px; }
svg .curve { fill: none; stroke-width: 1.8; }
svg .band { stroke: none; opacity: 0.13; }
svg .pt { cursor: pointer; stroke: var(--surface); stroke-width: 1.5; }
svg .pt:hover, svg .pt:focus { stroke: var(--ink); stroke-width: 2; outline: none; }
svg .note { fill: var(--muted); font-family: "IBM Plex Sans", sans-serif; font-size: 13px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ground); padding: 6px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 2; }
.tip b { font-weight: 500; }
.tip small { display: block; opacity: 0.75; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); margin-top: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
th:first-child, td:first-child { text-align: left; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
td.series { font-weight: 500; }
td.series i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; background: var(--c); }
td.pos { color: var(--good); } td.neg { color: var(--bad); }
td.base { color: var(--muted); }
td.miss { cursor: pointer; text-decoration: underline dotted; }
.placeholder { color: var(--muted); font-size: 13px; padding: 12px 0 0; }
.placeholder code { font-family: "IBM Plex Mono", monospace; font-size: 12px; }

.drawer { position: fixed; inset: 0 0 0 auto; width: min(680px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgb(0 0 0 / 0.15); display: flex; flex-direction: column; z-index: 3; }
.drawer header { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 20px 24px 12px; border-bottom: 1px solid var(--line); }
.drawer button { background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); padding: 4px 10px; cursor: pointer; font: inherit; }
.drawer button:focus-visible { outline: 2px solid var(--accent); }
.drawer ol { margin: 0; padding: 0 24px 24px; overflow-y: auto; list-style: none; display: grid; gap: 14px; }
.drawer li { border-bottom: 1px solid var(--line); padding-bottom: 12px; font-size: 13px; }
.drawer li q { display: block; color: var(--muted); quotes: none; margin-bottom: 6px; white-space: pre-wrap; }
.drawer li .pair { display: flex; gap: 20px; }
.drawer .pred { color: var(--bad); }
.drawer .gold { color: var(--good); }
.drawer .none { color: var(--warn); font-style: italic; }
.empty { color: var(--muted); padding: 32px; text-align: center; }
.back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 13px; margin-bottom: 12px; }
.back:hover { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
.chip { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 12px; background: var(--ground); }
.chip span { color: var(--muted); margin-right: 5px; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 10px; }
.multiples-group { margin-top: 20px; }
.multiple { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 6px; background: var(--surface); }
.multiple .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 2px; }
.multiple .head b { font-weight: 500; }
.multiple .head .mono { color: var(--muted); }
svg.spark { overflow: visible; }
svg.spark .line { fill: none; stroke: var(--accent); stroke-width: 1.4; }
svg.spark .grid line { stroke: var(--grid); }
svg.spark .epoch line { stroke: var(--muted); stroke-dasharray: 2 3; opacity: 0.7; }
svg.spark .ref line { stroke: var(--muted); stroke-dasharray: 4 3; }
svg.spark .ref text { fill: var(--muted); font-size: 9px; }
svg.spark .epoch text { fill: var(--muted); font-size: 9px; }
svg.spark text { fill: var(--muted); font-size: 10px; }
td.run a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted); }
td.run a:hover { border-bottom-style: solid; }
tr.grp td { cursor: pointer; background: var(--ground); }
tr.grp .chev { display: inline-block; width: 14px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide 160ms ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: 0; } } }
@media (max-width: 720px) { body { padding: 20px 16px 60px; } }
</style>

<header class="top">
  <div>
    <div class="eyebrow">Greedy pass@1 · vLLM · math-verify grading</div>
    <h1>TurboLoRA Curves</h1>
    <p>Accuracy of each adaptation against what it cost. Dashed lines are the untrained base models. Hover a point for the run, click it to open the run: training curves, evals and misses.</p>
  </div>
  <div class="controls">
    <div class="control"><span class="eyebrow">Compare</span><div class="toggle" id="view">
      <button type="button" data-v="dataset">Models on a dataset</button><button type="button" data-v="model">Datasets for a model</button>
    </div></div>
    <div class="control"><span class="eyebrow">Cost axis</span><div class="toggle" id="xaxis">
      <button type="button" data-x="params">Trainable params</button><button type="button" data-x="time">Training time</button><button type="button" data-x="vram">Peak VRAM</button>
    </div></div>
    <div class="control" id="train-control"><span class="eyebrow">Trained on</span><div class="toggle" id="train"></div></div>
  </div>
</header>

<nav id="nav"></nav>
<main id="page"></main>

<script>
const DATA = /*__DATA__*/null;
const TASK_LABEL = { gsm8k: "GSM8K", math500: "MATH-500", minerva: "Minerva", olympiad: "Olympiad", aime24: "AIME24", amc23: "AMC23", math: "MATH", easy: "SimpleRL easy", medium: "SimpleRL medium", hard: "SimpleRL hard" };
const XAXIS = {
  params: { key: "params", title: "trainable parameters", log: true, fmt: (v) => { const u = v >= 1e6 ? [1e6, "M"] : v >= 1e3 ? [1e3, "k"] : [1, ""], n = v / u[0]; return `${n >= 10 ? Math.round(n) : Number(n.toPrecision(2))}${u[1]}`; } },
  time: { key: "train_hours", title: "training time (GPU hours)", log: false, fmt: (v) => v < 1 ? `${Math.round(v * 60)} min` : `${v.toFixed(1)} h` },
  vram: { key: "peak_vram_gb", title: "peak training VRAM (GB)", log: false, fmt: (v) => `${v.toFixed(0)} GB` },
};
const PALETTE = ["#1f6e8c", "#c2542d", "#2f7a4f", "#7b4ea3", "#b58a12", "#c23d7a", "#3a8f8a", "#8a5a2b", "#5a6fbf", "#6b7a1e", "#a83a3a", "#3f7fa8"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => (100 * x).toFixed(1);
const median = (xs) => { const v = [...xs].sort((a, b) => a - b), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const signed = (x) => `${x >= 0 ? "+" : ""}${x.toFixed(1)}`;
const label = (t) => TASK_LABEL[t] ?? t;
const FAMILY = { qwen: "Qwen", deepseek: "DeepSeek", ministral: "Ministral", llama: "Llama", mistral: "Mistral" };
// "qwen2.5-7b-instruct" -> "Qwen2.5 (7b) instruct"
const modelLabel = (name) => {
  const m = /^([a-z]+)([\d.]*)-(\d+(?:\.\d+)?b|\d+x\d+b)(?:-(.+))?$/.exec(name);
  if (!m) return name;
  return `${FAMILY[m[1]] ?? m[1][0].toUpperCase() + m[1].slice(1)}${m[2]} (${m[3]})${m[4] ? ` ${m[4].replace(/-/g, " ")}` : ""}`;
};

const variantOf = (name) => /-math/.test(name) ? "math" : /-instruct/.test(name) ? "instruct" : "";
const baseFamilyOf = (name) => { const f = /^[a-z]+/.exec(name)?.[0] ?? name; return f === "ministral" || f === "mixtral" ? "mistral" : f; };
// only Qwen has enough variants to split into sub-families
const familyOf = (name) => { const f = baseFamilyOf(name), v = variantOf(name); return v && f === "qwen" ? `${f}-${v}` : f; };
const FAMILY_HUE = { qwen: 270, "qwen-instruct": 145, "qwen-math": 5, deepseek: 225, llama: 0, mistral: 28 };
const FAMILY_SAT = { llama: 0 };
const models = Object.keys(DATA.models);
const families = [...new Set(models.map(familyOf))];
const familyLabel = (f) => { const [base, v] = f.split("-"), name = FAMILY[base] ?? base[0].toUpperCase() + base.slice(1), versions = new Set(models.filter((m) => familyOf(m) === f).map((m) => /^[a-z]+([\d.]*)/.exec(m)?.[1] ?? "")); return `${name}${versions.size === 1 ? [...versions][0] : ""}${v ? ` (${v})` : ""}`; };
// variant sets the hue (math beats instruct for "-math-instruct"), size ramps lightness within family+variant
const modelColor = (name) => { const f = familyOf(name), v = variantOf(name), sib = models.filter((m) => familyOf(m) === f), i = sib.indexOf(name); const hue = FAMILY_HUE[f] ?? FAMILY_HUE[baseFamilyOf(name)] ?? (families.indexOf(baseFamilyOf(name)) * 67) % 360; return `hsl(${hue} ${FAMILY_SAT[baseFamilyOf(name)] ?? (v ? 70 : 55)}% ${sib.length > 1 ? 30 + 35 * i / (sib.length - 1) : 42}%)`; };
const tasks = DATA.tasks;
const runs = Object.entries(DATA.runs ?? {});
const trainSets = ["easy", "medium", "hard"];
const trainOk = (r) => (state.train === "all" || r.task === state.train) && !state.hiddenAdapters.has(r.adapter);
const shade = (c, j, n) => n > 1 ? `color-mix(in srgb, ${c}, var(--ground) ${Math.round(55 * j / (n - 1))}%)` : c;
const color = (i) => PALETTE[i % PALETTE.length];

// ---- state: view + x axis persist per viewer, tab lives in the hash, hidden/expanded last the session
const state = { view: "dataset", x: "params", train: "all", hidden: new Set(), hiddenAdapters: new Set(), expanded: new Set() };
try { Object.assign(state, JSON.parse(localStorage.getItem("turbolora-curves") ?? "{}"), { hidden: new Set(), hiddenAdapters: new Set(), expanded: new Set() }); } catch {}
const persist = () => { try { localStorage.setItem("turbolora-curves", JSON.stringify({ view: state.view, x: state.x, train: state.train })); } catch {} };
// models with no training runs start hidden in the chart; the legend brings them back
const modelsWithRuns = new Set(runs.map(([, r]) => r.model));
for (const m of models) if (!modelsWithRuns.has(m)) state.hidden.add(modelLabel(m));
const tabsFor = (view) => view === "dataset" ? tasks : models;
const route = () => { const [tab, run] = decodeURIComponent(location.hash.slice(1)).split("/run/"); return { tab, run: run && DATA.runs[run] ? run : null }; };
const currentTab = () => { const h = route().tab; return tabsFor(state.view).includes(h) ? h : tabsFor(state.view)[0]; };
const runHref = (id) => `#${encodeURIComponent(currentTab())}/run/${encodeURIComponent(id)}`;

// ---- series: in dataset view one per model, in model view one per task
function seriesFor(view, tab) {
  const x = XAXIS[state.x];
  const build = (name, model, task, c, extra = {}) => {
    const base = DATA.models[model]?.tasks[task];
    const pool = runs.filter(([, r]) => r.model === model && r.tasks[task] && r[x.key] != null && trainOk(r));
    const sets = state.train === "all" ? [...new Set(pool.map(([, r]) => r.task))] : [state.train];
    const split = sets.length > 1;
    // one series per training set when several are shown; the first carries the baseline label and unevaluated rows
    return (split ? sets : [null]).map((t, j) => ({
      name: t ? `${name} ← ${label(t)}` : name, model, task, train: t, primary: j === 0, color: shade(c, j, sets.length),
      base: base?.accuracy ?? null, baseStats: base,
      points: pool.filter(([, r]) => !t || r.task === t).map(([id, r]) => ({ id, run: r, x: r[x.key], y: r.tasks[task].accuracy, model, task })).sort((a, b) => a.x - b.x),
      ...extra,
    }));
  };
  return view === "dataset" ? models.flatMap((m) => build(modelLabel(m), m, tab, modelColor(m), { family: familyOf(m) })) : tasks.flatMap((t, i) => build(label(t), tab, t, color(i)));
}

// ---- controls + nav
function renderControls() {
  for (const b of document.querySelectorAll("#view button")) b.classList.toggle("on", b.dataset.v === state.view);
  for (const b of document.querySelectorAll("#xaxis button")) b.classList.toggle("on", b.dataset.x === state.x);
  $("#train").innerHTML = ["all", ...trainSets].map((t) => `<button type="button" data-t="${esc(t)}" class="${t === state.train ? "on" : ""}">${t === "all" ? "any" : esc(label(t))}</button>`).join("");
  const tab = currentTab();
  const link = (t) => `<a href="#${encodeURIComponent(t)}" class="${t === tab ? "active" : ""}">${esc(state.view === "dataset" ? label(t) : modelLabel(t))}</a>`;
  $("#nav").innerHTML = state.view === "dataset" ? tasks.map(link).join("") : families.map((f) => `<div class="group"><span class="eyebrow">${esc(familyLabel(f))}</span>${models.filter((m) => familyOf(m) === f).map(link).join("")}</div>`).join("");
}
$("#view").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; persist(); location.hash = ""; render(); });
$("#train").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.train = b.dataset.t; persist(); render(); });
$("#xaxis").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.x = b.dataset.x; persist(); render(); });
window.addEventListener("hashchange", render);

// ---- the chart
const ADAPTER = { tinylora: "TinyLoRA", loraxs: "LoRA-XS", lora: "LoRA", full: "full FT" };
// colour carries the series, shape carries the adapter: the families overlap in parameter count so position alone cannot separate them
const MARK = {
  tinylora: (x, y, r) => `<polygon points="${x},${y - r * 1.3} ${x + r * 1.3},${y} ${x},${y + r * 1.3} ${x - r * 1.3},${y}"`,
  loraxs: (x, y, r) => `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}"`,
  lora: (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"`,
  full: (x, y, r) => `<polygon points="${x},${y - r * 1.4} ${x + r * 1.3},${y + r} ${x - r * 1.3},${y + r}"`,
};
const mark = (a, x, y, r = 4.5) => (MARK[a] ?? MARK.lora)(x, y, r);
const W = 960, H = 420, M = { t: 16, r: 110, b: 48, l: 52 };
function renderChart(series) {
  const x = XAXIS[state.x];
  const shown = series.filter((s) => !state.hidden.has(s.name));
  const pts = shown.flatMap((s) => s.points);
  const xs = shown.flatMap((s) => s.points).map((p) => p.x).filter((v) => v > 0 || !x.log);
  const lo = x.log ? 1 : 0;
  let hi = xs.length ? Math.max(...xs) : (x.log ? 1e7 : 10);
  hi = x.log ? 10 ** Math.max(1, Math.ceil(Math.log10(hi))) : hi > 0 ? hi * 1.1 : 10;
  const sx = (v) => M.l + (x.log ? (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) : (v - lo) / (hi - lo)) * (W - M.l - M.r);
  // y range fits what is shown: baselines plus evaluated run points, padded and snapped to a tick step
  const ys = shown.flatMap((s) => [s.base, ...s.points.map((p) => p.y)]).filter((v) => v != null);
  let ylo = ys.length ? Math.min(...ys) : 0, yhi = ys.length ? Math.max(...ys) : 1;
  const span = Math.max(yhi - ylo, 0.05), ystep = [0.01, 0.02, 0.05, 0.1, 0.2].find((st) => span / st <= 8) ?? 0.2;
  ylo = Math.max(0, Math.floor((ylo - 0.1 * span) / ystep) * ystep); yhi = Math.min(1, Math.ceil((yhi + 0.1 * span) / ystep) * ystep);
  const sy = (v) => M.t + (yhi - v) / (yhi - ylo) * (H - M.t - M.b);
  const xticks = x.log ? Array.from({ length: Math.log10(hi) - Math.log10(lo) + 1 }, (_, i) => lo * 10 ** i) : Array.from({ length: 6 }, (_, i) => lo + (hi - lo) * i / 5);
  const yticks = Array.from({ length: Math.round((yhi - ylo) / ystep) + 1 }, (_, i) => ylo + i * ystep);

  let g = `<g class="grid">${yticks.map((v) => `<line x1="${M.l}" x2="${W - M.r}" y1="${sy(v)}" y2="${sy(v)}"/>`).join("")}${xticks.map((v) => `<line y1="${M.t}" y2="${H - M.b}" x1="${sx(v)}" x2="${sx(v)}"/>`).join("")}</g>`;
  g += `<g class="axis"><path d="M${M.l},${M.t}V${H - M.b}H${W - M.r}"/>`;
  g += yticks.map((v) => `<text x="${M.l - 8}" y="${sy(v) + 4}" text-anchor="end">${Math.round(100 * v)}</text>`).join("");
  g += xticks.map((v) => `<text x="${sx(v)}" y="${H - M.b + 16}" text-anchor="middle">${x.fmt(v)}</text>`).join("");
  g += `<text class="title" x="${(M.l + W - M.r) / 2}" y="${H - 8}" text-anchor="middle">${x.title}</text>`;
  g += `<text class="title" transform="translate(14,${(M.t + H - M.b) / 2}) rotate(-90)" text-anchor="middle">accuracy %</text></g>`;

  // baselines: dashed across the full width, labelled in the right margin
  for (const s of shown) if (s.base != null && (s.primary || !shown.some((o) => o !== s && o.model === s.model && o.task === s.task))) g += `<line class="base" style="stroke:${s.color}" x1="${M.l}" x2="${W - M.r}" y1="${sy(s.base)}" y2="${sy(s.base)}"/><text class="base-label" style="fill:${s.color}" x="${W - M.r + 6}" y="${sy(s.base) + 3}">${pct(s.base)} ${esc(s.train ? s.name.split(" ← ")[0] : s.name)}</text>`;
  // the families are separate sweeps, so one band and line per adapter; configs and seeds stack up at the same x and collapse to a median and a min-max spread
  const sweeps = shown.map((s) => [s, [...new Set(s.points.map((p) => p.run?.adapter))].map((a) => {
    const at = new Map();
    for (const p of s.points) if (p.run?.adapter === a) (at.get(p.x) ?? at.set(p.x, []).get(p.x)).push(p.y);
    return [...at].sort((u, v) => u[0] - v[0]).map(([x, ys]) => ({ x, med: median(ys), lo: Math.min(...ys), hi: Math.max(...ys) }));
  })]);
  // bands first so no series' spread hides another's runs
  for (const [s, adapters] of sweeps) for (const band of adapters) {
    if (band.length < 2 || band.every((b) => b.lo === b.hi)) continue;
    const edge = [...band.map((b) => `${sx(b.x)},${sy(b.hi)}`), ...band.slice().reverse().map((b) => `${sx(b.x)},${sy(b.lo)}`)];
    g += `<polygon class="band" style="fill:${s.color}" points="${edge.join(" ")}"/>`;
  }
  for (const [s, adapters] of sweeps) {
    for (const line of adapters) if (line.length > 1) g += `<polyline class="curve" style="stroke:${s.color}" points="${line.map((b) => `${sx(b.x)},${sy(b.med)}`).join(" ")}"/>`;
    g += s.points.map((p) => `${mark(p.run?.adapter, sx(p.x), sy(p.y))} class="pt" tabindex="0" style="fill:${s.color};stroke:var(--surface)" data-run="${esc(p.id)}" data-task="${p.task}" data-series="${esc(s.name)}" data-y="${p.y}"/>`).join("");
  }
  if (!pts.length) g += `<text class="note" x="${(M.l + W - M.r) / 2}" y="${(M.t + H - M.b) / 2}" text-anchor="middle">${runs.length ? "No evaluated runs for this selection yet" : "No training runs yet — baselines only"}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="accuracy versus ${x.title}">${g}</svg><div class="tip" id="tip" hidden></div>`;
}

function renderLegend(series) {
  const item = (s) => `<button type="button" class="${state.hidden.has(s.name) ? "off" : ""}" data-series="${esc(s.name)}" style="--c:${s.color}"><span class="swatch"></span>${esc(s.name)}<span class="mono" style="color:var(--muted)">${s.points.length}</span></button>`;
  const items = series[0]?.family ? families.map((f) => { const fam = series.filter((s) => s.family === f); return `<div class="group"><button type="button" class="family ${fam.every((s) => state.hidden.has(s.name)) ? "off" : ""}" data-family="${esc(f)}" data-names="${esc(JSON.stringify(fam.map((s) => s.name)))}">${esc(familyLabel(f))}</button>${fam.map(item).join("")}</div>`; }).join("") : series.map(item).join("");
  const adapters = [...new Set(runs.map(([, r]) => r.adapter).filter(Boolean))].sort((a, b) => Object.keys(MARK).indexOf(a) - Object.keys(MARK).indexOf(b));
  const key = adapters.length > 1 ? `<div class="group key">${adapters.map((a) => `<button type="button" class="${state.hiddenAdapters.has(a) ? "off" : ""}" data-adapter="${esc(a)}"><svg width="14" height="14" viewBox="0 0 14 14">${mark(a, 7, 7, 4)} fill="currentColor"/></svg>${esc(ADAPTER[a] ?? a)}</button>`).join("")}</div>` : "";
  return `<div class="legend">${items}${key}</div>`;
}

function renderTable(series) {
  const res = (r) => `<td class="mono">${r.params != null ? XAXIS.params.fmt(r.params) : "–"}</td><td class="mono">${r.train_hours != null ? XAXIS.time.fmt(r.train_hours) : "–"}</td><td class="mono">${r.peak_vram_gb != null ? XAXIS.vram.fmt(r.peak_vram_gb) : "–"}</td>`;
  const pad = (d) => ` style="padding-left:${12 + 18 * d}px"`;
  // "qwen2.5-7b-instruct" -> ["qwen2.5", "7b-instruct"]
  // top level mirrors the legend's families, so the variant only shows in the id when the family doesn't carry it
  const famId = (model) => { const f = familyOf(model), v = variantOf(model), rest = model.replace(/^[a-z]+[\d.]*-/, ""); return [familyLabel(f), (f.endsWith(`-${v}`) ? rest.replace(`-${v}`, "") : rest) || model]; };
  // leaf keeps what the tree levels above don't: rank/lr/extras/seed, plus the train set when a model mixes several
  const trainedOn = new Map();
  for (const [, r] of runs) trainedOn.set(r.model, (trainedOn.get(r.model) ?? new Set()).add(r.task));
  const leafOf = (id, r) => {
    const segs = id.split("/"), cfg = segs.length > 2 ? segs[segs.length - 2] : "";
    const toks = cfg.split(/-(?=[a-z])/).filter((t) => t && t !== r.adapter && t !== r.loss && !/^lr(?:[\d.]+(?:e[+-]?\d+)?)?$/.test(t));
    const i = toks.findIndex((t) => /^r\d+$/.test(t)); if (i > 0) toks.unshift(...toks.splice(i, 1));
    const task = state.train === "all" && (trainedOn.get(r.model)?.size ?? 0) > 1 ? r.task : "";
    return [task, ...toks, r.seed != null ? `seed${r.seed}` : segs[segs.length - 1]].filter(Boolean).join("_");
  };

  // rows mirror the run tree family/identifier/adapter/<config_seed>; dataset view merges every series into one shared tree, model view keeps one per task series; every level collapses
  const newNode = (color) => ({ color, base: null, entries: [], children: new Map() });
  const child = (n, name, color) => { if (!n.children.has(name)) n.children.set(name, newNode(color)); return n.children.get(name); };
  const roots = new Map();
  for (const s of series) {
    const shared = state.view === "dataset", rootKey = shared ? "" : s.name;
    if (state.hidden.has(s.name) && !shared) continue;
    if (!roots.has(rootKey)) roots.set(rootKey, newNode(s.color));
    const root = roots.get(rootKey);
    const modelNode = shared ? famId(s.model).reduce((n, lvl) => child(n, lvl, s.color), root) : root;
    const holder = (r) => child(modelNode, r.adapter ?? "?", s.color);
    // the baseline rides on the model's folder row in dataset view; model view gets a section row (no folder row to merge into)
    if (s.baseStats) shared ? (modelNode.baseline ??= s) : (root.base ??= () => `<tr><td class="series" style="--c:${s.color}"><i></i>${esc(s.name)}</td><td class="base">base model</td><td class="mono base">–</td><td class="mono base">–</td><td class="mono base">–</td><td class="mono">${pct(s.base)}</td><td class="mono base">–</td><td class="mono miss" data-model="${s.model}" data-task="${s.task}">${s.baseStats.n - s.baseStats.n_correct}${s.baseStats.unparsed ? `<span style="color:var(--warn)"> +${s.baseStats.unparsed}</span>` : ""}</td></tr>`);
    if (state.hidden.has(s.name)) continue; // chart-hidden models keep only their collapsed baseline row
    for (const p of s.points) {
      const st = p.run.tasks[p.task], d = s.base == null ? null : 100 * (p.y - s.base);
      holder(p.run).entries.push({ y: p.y, d, run: p.run, html: (dep) => `<tr><td class="series" style="--c:${s.color}"><i></i></td><td class="run"${pad(dep)}><a href="${runHref(p.id)}">${esc(leafOf(p.id, p.run))}</a></td>${res(p.run)}<td class="mono">${pct(p.y)}</td><td class="mono ${d == null ? "" : d >= 0 ? "pos" : "neg"}">${d == null ? "–" : signed(d)}</td><td class="mono miss" data-run="${esc(p.id)}" data-task="${p.task}">${st.n - st.n_correct}${st.unparsed ? `<span style="color:var(--warn)"> +${st.unparsed}</span>` : ""}</td></tr>` });
    }
    if (s.primary) for (const [id, r] of runs) if (r.model === s.model && !r.tasks[s.task] && trainOk(r)) holder(r).entries.push({ run: r, html: (dep) => `<tr><td class="series" style="--c:${s.color}"><i></i></td><td class="run"${pad(dep)}><a href="${runHref(id)}">${esc(leafOf(id, r))}</a><small style="color:var(--muted);margin-left:8px">${r.status === "running" ? `${live(r) ? "training" : "queued"} · step ${r.step ?? 0}${r.max_steps ? `/${r.max_steps}` : ""}${eta(r) ? ` · ${eta(r)}` : r.idle_hours ? ` · idle ${dur(r.idle_hours)}` : ""}` : `not evaluated on ${label(s.task)}`}</small></td>${res(r)}<td class="mono base">–</td><td class="mono base">–</td><td class="mono base">–</td></tr>` });
  }

  const bestOf = (n) => [...n.children.values()].map(bestOf).concat(n.entries).filter((e) => e?.y != null).sort((a, b) => b.y - a.y)[0];
  const statsOf = (n) => {
    const a = { done: 0, running: 0, pending: 0, eta: [] };
    for (const c of n.children.values()) { const s = statsOf(c); a.done += s.done; a.running += s.running; a.pending += s.pending; a.eta.push(...s.eta); }
    for (const e of n.entries) e.run?.status === "running" ? (a.running++, e.run.eta_time && a.eta.push(e.run.eta_time)) : e.y != null ? a.done++ : a.pending++;
    return a;
  };
  // folder hint: status counts plus the mean ETA of whatever is still training
  const hintOf = (st) => {
    const left = st.eta.length ? st.eta.reduce((s, t) => s + t, 0) / st.eta.length - Date.now() / 1000 : null;
    return [st.done && `${st.done} done`, st.running && `${st.running} running${left == null ? "" : left > 0 ? ` · ~${dur(left / 3600)} left` : " · overdue"}`, st.pending && `${st.pending} pending eval`].filter(Boolean).join(" · ");
  };
  const hasBase = (n) => !!n.baseline || [...n.children.values()].some(hasBase);
  const out = [];
  const emit = (n, dep, prefix) => {
    if (n.base) out.push(n.base(dep));
    for (const [name, c] of n.children) {
      const key = `${prefix}/${name}`, closed = !state.expanded.has(key), b = bestOf(c), st = statsOf(c), bs = c.baseline;
      if (!st.done && !st.running && !st.pending && !hasBase(c)) continue;
      out.push(`<tr class="grp" data-key="${esc(key)}"><td class="series" style="--c:${c.color}"><i></i></td><td class="run"${pad(dep)}><span class="chev">${closed ? "▸" : "▾"}</span><b>${esc(name)}</b><small style="color:var(--muted);margin-left:8px">${hintOf(st) || (hasBase(c) ? "base only" : "")}</small></td><td class="mono base">–</td><td class="mono base">–</td><td class="mono base">–</td><td class="mono${bs ? " base" : ""}" title="${bs ? "base model" : "best run"}">${bs ? pct(bs.base) : b?.y != null ? pct(b.y) : "–"}</td><td class="mono ${b?.d == null ? "" : b.d >= 0 ? "pos" : "neg"}" title="best run">${b?.d == null ? "–" : signed(b.d)}</td>${bs ? `<td class="mono miss" data-model="${bs.model}" data-task="${bs.task}">${bs.baseStats.n - bs.baseStats.n_correct}${bs.baseStats.unparsed ? `<span style="color:var(--warn)"> +${bs.baseStats.unparsed}</span>` : ""}</td>` : `<td class="mono base">–</td>`}</tr>`);
      if (!closed) emit(c, dep + 1, key);
    }
    for (const e of n.entries) out.push(e.html(dep));
  };
  for (const [rootKey, root] of roots) emit(root, 0, rootKey);
  return `<div class="scroll"><table><thead><tr><th>Series</th><th>Run</th><th>Params</th><th>Train time</th><th>Peak VRAM</th><th>Accuracy</th><th>Δ base</th><th>Wrong</th></tr></thead><tbody>${out.join("")}</tbody></table></div>`;
}

function render() {
  renderControls();
  closeDrawer();
  const tab = currentTab();
  if (route().run) return renderRun(route().run);
  if (tab == null) { $("#page").innerHTML = `<div class="placeholder">No baseline evals found.</div>`; return; }
  const series = seriesFor(state.view, tab);
  const n = DATA.models[series[0]?.model]?.tasks[series[0]?.task]?.n;
  const title = state.view === "dataset" ? `${label(tab)} <span class="mono" style="font-weight:400;color:var(--muted);font-size:14px">n = ${n ?? "?"}</span>` : `${esc(modelLabel(tab))} <span class="mono" style="font-weight:400;color:var(--muted);font-size:14px">${esc(DATA.models[tab].hf_id)}</span>`;
  $("#page").innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>${title}</h2>${renderLegend(series)}</div>
      <div class="chart-wrap">${renderChart(series)}</div>
    </div>
    ${runs.length ? "" : `<div class="placeholder">Training runs appear here once <code>outputs/&lt;run&gt;/run.json</code> (written by train.py) and <code>outputs/&lt;run&gt;/eval/&lt;task&gt;.json</code> exist.</div>`}
    ${renderTable(series)}`;
}

// ---- run page: metadata, training curves, evals
const CURVE_GROUPS = [
  ["Training signal", [
    ["reward", "reward (train accuracy)"], ["reward_std", "reward std"], ["loss", "loss"], ["grad_norm", "grad norm"],
    ["kl", "KL"], ["clip_ratio/region_mean", "clipped ratio (PPO)"], ["frac_reward_zero_std", "prompts with no signal"],
  ]],
  ["Completions", [
    ["completions/mean_length", "completion length"], ["completions/mean_terminated_length", "terminated length"],
    ["completions/clipped_ratio", "clipped completions"],
  ]],
  ["Resources", [
    ["learning_rate", "learning rate"], ["num_tokens", "tokens seen"],
    ["peak_vram_gib", "peak VRAM (GiB)"], ["elapsed_hours", "elapsed hours"],
  ]],
];
// duplicates and min/max variants of keys already charted; keep them out of "Other"
const clock = (t) => new Date(1000 * t).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
const dur = (h) => h < 1 ? `${Math.max(1, Math.round(60 * h))} min` : h < 48 ? `${h.toFixed(1)} h` : `${(h / 24).toFixed(1)} d`;
const agoFmt = (s) => { s = Math.max(0, Math.round(s)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s ago` : `${dur(s / 3600)} ago`; };
const tickAgo = () => { for (const el of document.querySelectorAll("span.ago")) el.textContent = agoFmt(Date.now() / 1000 - +el.dataset.t); };
setInterval(tickAgo, 1000);
// only a run whose checkpoints are still advancing gets an eta_time; the rest sit in the queue
const live = (r) => r.eta_time != null;
const eta = (r) => { if (!r.eta_time) return null; const left = (r.eta_time - Date.now() / 1000) / 3600; return left < 0 ? `overdue by ${dur(-left)}` : `${dur(left)} left`; };
const fmtNum = (v) => Math.abs(v) >= 1e4 || (v !== 0 && Math.abs(v) < 1e-3) ? v.toExponential(1) : Number(v.toPrecision(3)).toString();
function spark(name, pts, epochs = [], ref = null) {
  const w = 260, h = 110, m = { t: 6, r: 6, b: 18, l: 40 };
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const xlo = Math.min(...xs), xhi = Math.max(...xs, xlo + 1);
  let ylo = Math.min(...ys), yhi = Math.max(...ys);
  if (ref != null) { ylo = Math.min(ylo, ref); yhi = Math.max(yhi, ref); }
  if (yhi === ylo) { ylo -= Math.abs(ylo) * 0.1 || 0.1; yhi += Math.abs(yhi) * 0.1 || 0.1; }
  const sx = (v) => m.l + (v - xlo) / (xhi - xlo) * (w - m.l - m.r), sy = (v) => m.t + (yhi - v) / (yhi - ylo) * (h - m.t - m.b);
  const yt = [ylo, (ylo + yhi) / 2, yhi], xt = [xlo, Math.round((xlo + xhi) / 2), xhi];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(name)} over training steps">
    <g class="grid">${yt.map((v) => `<line x1="${m.l}" x2="${w - m.r}" y1="${sy(v)}" y2="${sy(v)}"/>`).join("")}</g>
    <g class="epoch">${epochs.filter((e) => e.step > xlo && e.step < xhi).map((e) => `<line x1="${sx(e.step)}" x2="${sx(e.step)}" y1="${m.t}" y2="${h - m.b}"/><text x="${sx(e.step) + 2}" y="${m.t + 8}">ep ${e.epoch}</text>`).join("")}</g>
    ${ref != null ? `<g class="ref"><line x1="${m.l}" x2="${w - m.r}" y1="${sy(ref)}" y2="${sy(ref)}"/><text x="${w - m.r}" y="${sy(ref) - 3}" text-anchor="end">base</text></g>` : ""}
    ${yt.map((v) => `<text x="${m.l - 5}" y="${sy(v) + 3}" text-anchor="end">${fmtNum(v)}</text>`).join("")}
    ${xt.map((v) => `<text x="${sx(v)}" y="${h - 4}" text-anchor="middle">${v}</text>`).join("")}
    <polyline class="line" points="${pts.map((p) => `${sx(p.x)},${sy(p.y)}`).join(" ")}"/>
  </svg>`;
}
function renderRun(id) {
  const r = DATA.runs[id], tab = currentTab();
  const meta = [["model", modelLabel(r.model)], ["task", label(r.task)], ["adapter", ADAPTER[r.adapter] ?? r.adapter], ["loss", r.loss], ["rank", r.rank], ["u", r.proj_dim], ["tie", r.tie], ["seed", r.seed], ["steps", r.status === "running" ? `${r.step ?? 0}${r.max_steps ? ` / ${r.max_steps}` : ""}` : r.steps], ["eta", r.status !== "running" ? null : eta(r) ? `${eta(r)} (${clock(r.eta_time)})` : r.idle_hours ? `queued, idle ${dur(r.idle_hours)}` : null],
    ["params", r.params != null ? XAXIS.params.fmt(r.params) : null], ["time", r.train_hours != null ? XAXIS.time.fmt(r.train_hours) : null], ["VRAM", r.peak_vram_gb != null ? XAXIS.vram.fmt(r.peak_vram_gb) : null], ["gpu", r.gpu]]
    .filter(([, v]) => v != null).map(([k, v]) => `<span class="chip"><span>${esc(k)}</span><span class="mono" style="color:inherit;margin:0">${esc(v)}</span></span>`).join("");
  const curves = (r.curves ?? []);
  // first step of each new epoch
  const epochs = curves.filter((row, i) => i > 0 && Math.floor(row.epoch) > Math.floor(curves[i - 1].epoch)).map((row) => ({ step: row.step, epoch: Math.floor(row.epoch) + 1 }));
  const cell = (k, name, head, ref) => { const pts = curves.filter((row) => row[k] != null).map((row) => ({ x: row.step, y: row[k] })); return pts.length ? `<div class="multiple"><div class="head"><b>${esc(name)}</b><span class="mono">${head ?? fmtNum(pts[pts.length - 1].y)}</span></div>${spark(name, pts, epochs, ref)}</div>` : ""; };
  const section = (title, cells) => cells ? `<div class="multiples-group"><div class="eyebrow">${esc(title)}</div><div class="multiples">${cells}</div></div>` : "";
  // benchmarks first: one card per eval_<task> series, unparsed count folded into the header, base accuracy as reference line
  const allKeys = [...new Set(curves.flatMap(Object.keys))];
  const benches = allKeys.filter((k) => k.startsWith("eval_") && !k.endsWith("_unparsed")).sort().map((k) => {
    const t = k.slice(5), last = curves.filter((row) => row[k] != null).pop(), un = last[`${k}_unparsed`];
    return cell(k, label(t), `${pct(last[k])}${un ? ` <span style="color:var(--warn)">${un} unparsed</span>` : ""}`, DATA.models[r.model]?.tasks[t]?.accuracy);
  }).join("");
  const known = new Set([...CURVE_GROUPS.flatMap(([, ks]) => ks.map(([k]) => k)), "step", "epoch"]);
  const extras = allKeys.filter((k) => !known.has(k) && !k.startsWith("eval_"));
  const multiples = [
    section("Benchmarks · full test set, greedy at the training budget", benches),
    ...CURVE_GROUPS.map(([title, ks]) => section(title, ks.map(([k, name]) => cell(k, name)).join(""))),
    section("Other", extras.map((k) => cell(k, k)).join("")),
  ].join("");
  const evals = Object.entries(r.tasks).map(([t, st]) => { const base = DATA.models[r.model]?.tasks[t]?.accuracy, d = base == null ? null : 100 * (st.accuracy - base); return `<tr><td>${label(t)}</td><td class="mono">${pct(st.accuracy)}</td><td class="mono base">${base == null ? "–" : pct(base)}</td><td class="mono ${d == null ? "" : d >= 0 ? "pos" : "neg"}">${d == null ? "–" : signed(d)}</td><td class="mono miss" data-run="${esc(id)}" data-task="${t}">${st.n - st.n_correct}${st.unparsed ? `<span style="color:var(--warn)"> +${st.unparsed}</span>` : ""}</td></tr>`; }).join("");
  $("#page").innerHTML = `
    <a class="back" href="#${encodeURIComponent(tab)}">← ${esc(state.view === "dataset" ? label(tab) : modelLabel(tab))}</a>
    <div class="panel">
      <div class="eyebrow">Training run${r.status === "running" ? ` · ${live(r) ? "still training" : "queued"}${r.checkpoint_time ? `, last checkpoint <span class="ago" data-t="${r.checkpoint_time}"></span> (${esc(clock(r.checkpoint_time))})` : ""}` : ""}</div>
      <h2 class="mono" style="font-family:'IBM Plex Mono',monospace;font-size:16px">${esc(id)}</h2>
      <div class="chips">${meta}</div>
      ${multiples || `<div class="placeholder">No training curves: no <code>checkpoint-*/trainer_state.json</code> in the run dir.</div>`}
    </div>
    ${evals ? `<div class="scroll"><table><thead><tr><th>Eval</th><th>Accuracy</th><th>Base</th><th>Δ base</th><th>Wrong</th></tr></thead><tbody>${evals}</tbody></table></div>` : `<div class="placeholder">${r.status === "running" ? "Still training; the last snapshot is evaluated in-run — " : "Not evaluated yet — "}<code>sbatch slurm/eval_sweep.sh</code></div>`}`;
}

// ---- tooltip + drawer
function showTip(el) {
  const x = XAXIS[state.x], r = DATA.runs[el.dataset.run], st = r.tasks[el.dataset.task];
  const acc = st ? st.accuracy : Number(el.dataset.y);
  const box = el.getBoundingClientRect(), wrap = el.closest(".chart-wrap").getBoundingClientRect();
  const tip = $("#tip");
  tip.innerHTML = `<b>${esc(el.dataset.run)}</b><small>${esc(el.dataset.series)}${r.task && !el.dataset.series.includes(" ← ") ? ` · trained on ${esc(label(r.task))}` : ""} · ${pct(acc)}% · ${x.fmt(r[x.key])}</small>`;
  tip.style.left = `${box.left + box.width / 2 - wrap.left}px`; tip.style.top = `${box.top - wrap.top}px`; tip.hidden = false;
}
function openDrawer(who, task, stats) {
  closeDrawer();
  const items = stats.misses.map((r) => `<li><q>${esc(DATA.questions[r.q])}</q><div class="pair"><span>predicted <b class="${r.predicted == null ? "none" : "pred"} mono">${r.predicted == null ? "unparsed" : esc(r.predicted)}</b></span><span>answer <b class="gold mono">${esc(r.answer)}</b></span></div></li>`);
  const drawer = document.createElement("aside");
  drawer.className = "drawer";
  drawer.innerHTML = `<header><div><div class="eyebrow">${esc(who)} · ${label(task)}</div><h2>${stats.misses.length} wrong of ${stats.n} <span style="color:var(--muted);font-weight:500">(${stats.unparsed} unparsed)</span></h2></div><button type="button" id="close">Close</button></header>${items.length ? `<ol>${items.join("")}</ol>` : `<div class="empty">Every answer was correct.</div>`}`;
  document.body.appendChild(drawer);
  drawer.querySelector("#close").onclick = closeDrawer;
  drawer.querySelector("#close").focus();
}
function closeDrawer() { document.querySelector(".drawer")?.remove(); }
const drawerFor = (el) => el.dataset.run ? openDrawer(el.dataset.run, el.dataset.task, DATA.runs[el.dataset.run].tasks[el.dataset.task]) : openDrawer(el.dataset.model, el.dataset.task, DATA.models[el.dataset.model].tasks[el.dataset.task]);

document.addEventListener("click", (e) => {
  const fam = e.target.closest(".legend button.family"); if (fam) { const names = JSON.parse(fam.dataset.names), anyShown = names.some((n) => !state.hidden.has(n)); for (const n of names) anyShown ? state.hidden.add(n) : state.hidden.delete(n); return render(); }
  const ad = e.target.closest(".legend .key button"); if (ad) { const a = ad.dataset.adapter; state.hiddenAdapters.has(a) ? state.hiddenAdapters.delete(a) : state.hiddenAdapters.add(a); return render(); }
  const leg = e.target.closest(".legend button"); if (leg) { const n = leg.dataset.series; state.hidden.has(n) ? state.hidden.delete(n) : state.hidden.add(n); return render(); }
  const el = e.target.closest("td.miss"); if (el) return drawerFor(el);
  const grp = e.target.closest("tr.grp"); if (grp) { const k = grp.dataset.key; state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k); return render(); }
  const pt = e.target.closest(".pt"); if (pt) { location.hash = runHref(pt.dataset.run); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "Enter" && e.target.matches(".pt")) location.hash = runHref(e.target.dataset.run);
});
document.addEventListener("mouseover", (e) => { const pt = e.target.closest?.(".pt"); if (pt) showTip(pt); else if ($("#tip")) $("#tip").hidden = true; });
document.addEventListener("focusin", (e) => { if (e.target.matches?.(".pt")) showTip(e.target); });

render();
</script>
